<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title description">
<title id="title">Session output: collection, rendering and emitter-scoped sending</title>
<desc id="description">Authorized ACP updates reach SessionOutput and focused text/tool/card collectors. Pure message and activity renderers feed independent MatrixOutputSender subscriptions. ConversationPublication serializes bounded work through MatrixDelivery and the SDK. Durable stores retain routing only.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:DejaVu Sans,sans-serif;fill:#172033;font-size:20px}.heading{font-size:30px;font-weight:700}.name{font-size:24px;font-weight:700}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.existing{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}</style></defs><rect width="1200" height="1060" fill="white"/>
<text x="40" y="48" class="heading">Session-scoped output survives prompt completion</text>
<text x="40" y="84">Collectors own content. Each sender subscription alone owns Matrix event IDs.</text>
<rect x="40" y="120" width="710" height="115" rx="12" class="box"/>
<text x="62" y="156" class="name">BridgeCoordinator → SessionOutput</text>
<text x="62" y="190">One normalized ACP listener; authorized room/thread generation.</text>
<text x="62" y="219">Replay, unknown/stale session and lifecycle guards.</text>
<rect x="820" y="120" width="340" height="115" rx="12" class="existing"/>
<text x="842" y="156" class="name">Session stores</text>
<text x="842" y="190">Durable routes only.</text>
<text x="842" y="219">No output/mapping persistence.</text>
<path d="M820 177H750" class="line"/>
<rect x="40" y="305" width="530" height="150" rx="12" class="box"/>
<text x="62" y="341" class="name">TextCollector × 2</text>
<text x="62" y="375">Separate message/thought instances.</text>
<text x="62" y="404">PublicationScheduler: bytes / quiet / max.</text>
<text x="62" y="433">New response ID finishes both old owners.</text>
<rect x="630" y="305" width="530" height="150" rx="12" class="box"/>
<text x="652" y="341" class="name">ToolCollector + AcpToolModel</text>
<text x="652" y="375">Concurrent tool patches and terminal output.</text>
<text x="652" y="404">PublicationScheduler paces intermediate edits.</text>
<text x="652" y="433">Starts and terminal changes flush immediately.</text>
<path d="M300 235V305" class="line"/>
<path d="M700 235V270H900V305" class="line"/>
<rect x="630" y="525" width="530" height="120" rx="12" class="box"/>
<text x="652" y="561" class="name">ActivityCardCollector</text>
<text x="652" y="595">Stable cards retain thought/tool destinations.</text>
<text x="652" y="624">Closed + all entries finished → finish(cardId).</text>
<path d="M895 455V525" class="line"/>
<path d="M570 405H600V585H630" class="line"/>
<rect x="40" y="525" width="530" height="120" rx="12" class="box"/>
<text x="62" y="561" class="name">Pure message rendering</text>
<text x="62" y="595">renderOutput → renderMatrixTextChunks</text>
<text x="62" y="624">Safe Markdown; bounded continuation parts.</text>
<path d="M300 455V525" class="line"/>
<rect x="630" y="700" width="530" height="120" rx="12" class="box"/>
<text x="652" y="736" class="name">Pure activity rendering</text>
<text x="652" y="770">renderOutput → renderActivityCard</text>
<text x="652" y="799">Safe thought Markdown + escaped tool output.</text>
<path d="M895 645V700" class="line"/>
<rect x="40" y="700" width="530" height="120" rx="12" class="box"/>
<text x="62" y="736" class="name">MatrixOutputSender × 2</text>
<text x="62" y="770">flush(id, cumulativeParts) / finish(id)</text>
<text x="62" y="799">Independent emitter namespaces; live IDs only.</text>
<path d="M300 645V700" class="line"/>
<path d="M630 760H570" class="line"/>
<rect x="40" y="890" width="1120" height="120" rx="12" class="existing"/>
<text x="62" y="926" class="name">ConversationPublication → MatrixDelivery → Matrix SDK</text>
<text x="62" y="960">Bounded FIFO/coalescing; first expanded card is a barrier; finish releases mappings after final delivery.</text>
<text x="62" y="989">Existing retries, room/thread routing and encrypted transport; no new history cache or retry layer.</text>
<path d="M300 820V890" class="line"/>
<text x="40" y="1043">Chad’s Agent · PR #28 · First publication fixes placement; snapshots edit originals.</text></svg>
